name: VTi 15 Solo2 MIPS build
on:
  push:
    branches: [feature/vti-solo2-port]
    paths: ['CI/vti/**', '.github/workflows/vti-solo2-build.yml', 'src/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mips-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: mips-cache
        with:
          path: work/vti-mips-base.tar
          key: vti-jessie-mips-gcc49-v2-f5b6409b
      - name: Prepare public headers and exact VTi runtime libraries
        run: |
          SERVICEAPP_PREPARE_ONLY=1 sh CI/vti/check_vuplus_headers.sh
          python3 CI/vti/prepare_target.py work/vti-target
          curl -fL --retry 2 --max-time 120 https://ffmpeg.org/releases/ffmpeg-3.4.1.tar.xz -o work/ffmpeg.tar.xz
          echo '5a77278a63741efa74e26bf197b9bb09ac6381b9757391b922407210f0f991c0  work/ffmpeg.tar.xz' | sha256sum -c -
          tar xJf work/ffmpeg.tar.xz -C work
          git init -q work/vti-exteplayer
          git -C work/vti-exteplayer fetch --depth 1 https://github.com/oe-mirrors/exteplayer3.git e258b47863fae1d74dbd1d707c948ae4232fea64
          git -C work/vti-exteplayer checkout -q --detach FETCH_HEAD
          patch -p1 -d work/vti-exteplayer < CI/openpli/exteplayer3-live.patch
          # Fail before the expensive target build if any listed source is absent.
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('CI/vti/build_inside.sh').read_text()
          base = re.search(r'base=\((.*?)\)', text, re.S).group(1).split()
          writers = re.search(r'writers=\((.*?)\)', text, re.S).group(1).split()
          listed = base + ['output/writer/mipsel/' + name + '.c' for name in writers]
          root = Path('work/vti-exteplayer')
          missing = [name for name in listed if not (root / name).is_file()]
          assert not missing, missing
          actual = {p.name for p in (root / 'output/writer/mipsel').glob('*.c')}
          assert actual == {name + '.c' for name in writers}, actual
          print('All pinned MIPS player sources accounted for')
          PY
      - name: Prepare archived GCC4.9 MIPS build system
        id: prepare-mips
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support
          curl -fL https://archive.debian.org/debian/dists/jessie/Release -o work/jessie-Release
          echo 'f5b6409b287484bb612f6542a1ebd8cf046dcb0fdb4dcd8d677493d9aaf7d348  work/jessie-Release' | sha256sum -c -
          # Historical signing keys have expired; authenticate the archive by
          # this pinned Release hash and debootstrap's package/index checksums.
          if [ -f work/vti-mips-base.tar ]; then
            sudo mkdir -p work/mips-root
            sudo tar -xf work/vti-mips-base.tar -C work/mips-root
          else
            sudo debootstrap --arch=mipsel --foreign --variant=minbase --no-check-gpg \
              --include=g++,make,m4,python2.7-dev,libssl-dev,libfreetype6-dev,libpng12-dev \
              jessie work/mips-root https://archive.debian.org/debian
          fi
          sudo cp /usr/bin/qemu-mipsel-static work/mips-root/usr/bin/
          sudo update-binfmts --enable qemu-mipsel
          if [ ! -f work/vti-mips-base.tar ]; then
            sudo chroot work/mips-root /debootstrap/debootstrap --second-stage
            sudo tar -C work/mips-root -cf work/vti-mips-base.tar .
            sudo chown "$(id -u):$(id -g)" work/vti-mips-base.tar
          fi
          sudo mkdir -p work/mips-root/src
          tar --exclude=.git --exclude=work/mips-root --exclude=work/vti-mips-base.tar -cf - . | sudo tar -xf - -C work/mips-root/src
      - uses: actions/cache/save@v4
        if: steps.mips-cache.outputs.cache-hit != 'true'
        with:
          path: work/vti-mips-base.tar
          key: vti-jessie-mips-gcc49-v2-f5b6409b
      - name: Compile ServiceApp and player with native MIPS GCC4.9
        id: build
        run: sudo chroot work/mips-root /bin/bash /src/CI/vti/build_inside.sh
      - name: Collect candidate binaries and diagnostics
        if: always()
        run: |
          mkdir -p work/vti-result
          sudo cp -r work/mips-root/src/work/vti-build/. work/vti-result/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" work/vti-result
          find work/vti-result -maxdepth 1 -type f -name '*.o' -delete
      - name: Verify imports and selected timer fields against official VTi
        if: steps.build.outcome == 'success'
        run: |
          python3 -m pip install pyelftools==0.32
          python3 CI/vti/validate_target.py work/vti-target work/vti-result
          python3 CI/vti/package_candidates.py work/vti-result work/vti-package --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vti-solo2-candidate-diagnostics
          path: |
            work/vti-result/
            work/vti-target/manifest.json
            work/mips-root/debootstrap/debootstrap.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vti-solo2-test-packages
          path: work/vti-package/
